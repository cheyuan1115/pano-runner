<!doctype html>
<meta charset="utf-8">
<title>pano-runner 啟動器</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d0e10; color: #e8e8ea;
               font: 14px/1.6 -apple-system, "PingFang TC", sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; cursor: crosshair; overflow: hidden; }
  #map.pan { cursor: grabbing; }
  .tile { position: absolute; width: 256px; height: 256px;
          filter: saturate(.45) brightness(1.04); }   /* OSM 官方磚太花,淡化 */
  .svtile { position: absolute; width: 256px; height: 256px; pointer-events: none; opacity: .9; }   /* Google 街景涵蓋藍線 */
  /* canvas 是替換元素：只寫 inset:0 不會把它撐開，CSS 尺寸會沿用內在尺寸
     （也就是 ink.width = 視窗寬 × dpr），等於整張畫布放大兩倍、標記位置全偏掉。
     一定要明寫 width/height。#gl 有寫 100vw 所以跑步頁沒事，只有這張漏了。 */
  #ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* max-height + 捲動不能少 —— 選項愈加愈多(櫻花、鎖定月份、特色路線),
     視窗矮一點「開始跑」就被推出畫面外,看起來像自由跑功能不見了(實測)。 */
  #side { position: absolute; right: 14px; top: 14px; width: 290px; z-index: 5;
          background: rgba(16,17,21,.92); border: 1px solid #2c2f36; border-radius: 12px;
          padding: 14px 15px; backdrop-filter: blur(10px);
          max-height: calc(100vh - 28px); overflow-y: auto; }
  h1 { font-size: 15px; margin: 0 0 10px; letter-spacing: .3px; }
  label { display: block; font-size: 12px; color: #8b909a; margin: 11px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; background: #1a1c21; color: #e8e8ea;
                  border: 1px solid #33373f; border-radius: 7px; padding: 7px 9px; font: inherit; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 8px;
           background: #2f7d4f; color: #fff; font: 600 14px/1 inherit; cursor: pointer; }
  button:disabled { background: #24262b; color: #6a6f78; cursor: default; }
  button.ghost { background: #24262b; color: #c9ccd2; margin-top: 8px; padding: 7px; font-weight: 400; }
  #step { font-size: 12px; color: #6fd08c; min-height: 34px; margin-top: 8px; }
  #mattr { position: absolute; right: 14px; bottom: 12px; z-index: 4; font-size: 11px;
           color: #6a6f78; background: rgba(16,17,21,.7); padding: 3px 8px; border-radius: 6px; }
  #hint { position: absolute; left: 14px; bottom: 14px; font-size: 12px; color: #8b909a;
          background: rgba(16,17,21,.88); border: 1px solid #2c2f36; border-radius: 9px;
          padding: 8px 11px; white-space: pre; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .quick span { font-size: 12px; padding: 4px 8px; background: #1a1c21; border: 1px solid #33373f;
                border-radius: 999px; cursor: pointer; }
  .quick span:hover { border-color: #2f7d4f; }
  /* 特色路線（軌道）收摺起來 —— 11 顆按鈕把版面吃掉太多 */
  #trailhead { font-size: 12px; padding: 4px 8px; background: #14251a; border: 1px solid #2f7d4f;
               border-radius: 999px; cursor: pointer; user-select: none; }
  #trails { display: none; }
  #trails.open { display: flex; flex-wrap: wrap; gap: 6px; }
</style>

<div id="map"></div>
<canvas id="ink"></canvas>

<div id="side">
  <h1>pano-runner 啟動器</h1>

  <label>找地方</label>
  <div class="row">
    <input id="q" placeholder="巴黎、台北市、河口湖…">
    <button class="ghost" id="go" style="flex:0 0 56px;margin:0">搜尋</button>
  </div>
  <div class="quick" id="quick"></div>
  <div class="quick" style="margin-top:4px"><span id="trailhead">🌸 特色路線 ▸</span>
    <span id="aiplan">🤖 AI 排路線</span>
    <span id="vibehot" title="店家密度=熱鬧程度(OSM 資料)">🔥 鬧區</span>
    <span id="srcbtn" title="Apple 台灣畫質較好、影像較新;時光機只有 Google 有">🌐 Google 街景</span>
    <select id="plankm" style="width:auto;padding:3px 6px;margin:0">
      <option value="3">3 km</option><option value="5" selected>5 km</option>
      <option value="8">8 km</option><option value="10">10 km</option>
    </select></div>
  <div class="quick" id="trails"></div>

  <label>速度　<b id="kmhv">12</b> km/h</label>
  <input id="kmh" type="range" min="4" max="20" step="1" value="12">
  <label style="display:flex;align-items:center;gap:7px;margin-top:9px;color:#c9ccd2">
    <input id="mic" type="checkbox" style="width:auto;margin:0">
    用麥克風聽跑步聲決定速度
  </label>
  <div id="micnote" style="font-size:11px;color:#6a6f78;display:none">
    上面的滑桿變成沒聽到腳步聲時的上限。跑步機的腳步聲要收得到。</div>
  <label style="display:flex;align-items:center;gap:7px;margin-top:7px;color:#c9ccd2">
    <input id="narrate" type="checkbox" checked style="width:auto;margin:0">
    景點導覽（到附近會問，說「導覽」才播）
  </label>

  <label id="pairlb">器材（配對一次，開跑自動連）</label>
  <div class="row" id="pairrow">
    <button class="ghost" id="btpair" style="margin:0">🚴 跑步機／練習台</button>
    <button class="ghost" id="hrpair" style="margin:0">♥ 心率</button>
  </div>
  <label style="display:flex;align-items:center;gap:6px">
    <input id="sakura" type="checkbox" style="width:auto;margin:0">
    🌸 櫻花模式（自動切到 4 月的歷史街景）
  </label>
  <label style="display:flex;align-items:center;gap:6px">
    📅 鎖定月份
    <select id="lockmonth" style="width:auto;margin:0">
      <option value="">不限</option>
      <option value="11,10">10–11 月（紅葉）</option>
      <option value="1,2,12">12–2 月（雪景）</option>
      <option value="7,8">7–8 月（盛夏）</option>
      <option value="1">1 月</option><option value="2">2 月</option>
      <option value="3">3 月</option><option value="4">4 月</option>
      <option value="5">5 月</option><option value="6">6 月</option>
      <option value="7">7 月</option><option value="8">8 月</option>
      <option value="9">9 月</option><option value="10">10 月</option>
      <option value="11">11 月</option><option value="12">12 月</option>
    </select>
    （有歷史街景才切得過去）
  </label>
  <label style="display:flex;align-items:center;gap:7px;margin-top:7px;color:#c9ccd2">
    <input id="voice" type="checkbox" checked style="width:auto;margin:0">
    語音操控（左轉／右轉／回頭／導覽／結束跑步）
  </label>

  <div class="row">
    <div>
      <label>畫面</label>
      <select id="panels">
        <option value="5">五片（接縫折角最小）</option>
        <option value="3">三片</option>
        <option value="1">單片</option>
        <option value="pan" selected>連續超廣角（Panini，無接縫）</option>
      </select>
    </div>
    <div>
      <label>解析度</label>
      <select id="zoom">
        <option value="3">3（省流量）</option>
        <option value="4" selected>4（一般）</option>
        <option value="5">5（最清晰）</option>
      </select>
    </div>
  </div>

  <div id="runs" style="display:none">
    <label>跑過的路線</label>
    <div id="runlist" style="max-height:150px;overflow:auto;font-size:12px"></div>
  </div>

  <div id="step">先在地圖上點一下「起跑點」。</div>
  <button id="start" disabled>開始跑</button>
  <button class="ghost" id="reset">重設</button>
</div>

<div id="zoombtn">
  <span id="zin">＋</span><span id="zout">－</span><b id="zlvl"></b>
</div>
<div id="mattr">© OpenStreetMap 貢獻者</div>
<div id="hint">拖曳或兩指滑動＝移動　捏合或 ＋－ ＝縮放
點第 1 下＝起跑點，之後每點一下加一個要跑到的點（會依序跑過去）
橘點是景點，點它就會加進路線（自動吸到最近的街景）</div>
<style>
  #zoombtn { position: absolute; left: 14px; top: 14px; z-index: 5; display: flex;
             align-items: center; gap: 2px; background: rgba(16,17,21,.9);
             border: 1px solid #2c2f36; border-radius: 9px; overflow: hidden; }
  #zoombtn span { width: 34px; height: 32px; display: grid; place-items: center;
                  cursor: pointer; color: #e8e8ea; font-size: 15px; user-select: none; }
  #zoombtn span:hover { background: #23262c; }
  #zoombtn b { font-size: 11px; color: #8a8f98; padding: 0 9px 0 5px; font-weight: 400; }
</style>

<script src="launcher.js"></script>
